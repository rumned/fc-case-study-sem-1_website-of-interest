<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Trivia Timeline</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Press+Start+2P&family=Rubik+Dirt&family=VT323&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="timeline-spine"></div>

    <div class="timeline">
      <div class="cursor-container">
        <div class="cursor">😀</div>
        <div class="altitude-readout"></div>
      </div>
    </div>

    <div class="controller-panel">
      <input type="number" id="altitude-input" placeholder="Altitude (m)" />
      <button id="go-btn">Go</button>
      <button id="up-btn">⬆️ Up</button>
      <button id="down-btn">⬇️ Down</button>
    </div>

    <script src="timeline-data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
